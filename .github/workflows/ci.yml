name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the workflow be kicked off by hand from the Actions tab.
  workflow_dispatch:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly the lockfile, including DuckDB's prebuilt
      # native addon for linux-x64.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Includes the reconciliation suite, which asserts the SQL aggregation
      # agrees with the independent TypeScript reference implementation.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Proves the ingestion pipeline runs end to end on a clean machine and
      # that the DuckDB file it writes is queryable.
      - name: Seed a DuckDB file and query it back
        run: |
          npx tsx scripts/seed.ts --hours 24
          node -e "
            const { DuckDBInstance } = require('@duckdb/node-api');
            (async () => {
              const db = await DuckDBInstance.create('data/events.duckdb');
              const c = await db.connect();
              const r = await c.runAndReadAll('SELECT count(*) AS n FROM v_requests');
              const n = Number(r.getRowObjects()[0].n);
              if (!Number.isFinite(n) || n < 1000) {
                throw new Error('seeded store looks empty: ' + n);
              }
              console.log('seeded store holds ' + n.toLocaleString() + ' events');
            })().catch((e) => { console.error(e); process.exit(1); });
          "
